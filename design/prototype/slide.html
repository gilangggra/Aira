<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EMO Robot Eyes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif
        }

        :root {
            --bg: #0a0d13;
            --fg: #f8fafc;
            --card: #141923;
            --line: #242c3b;
            --mut: #94a3b8;
            --acc: #38bdf8;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0a0d13;
                --fg: #f8fafc
            }
        }

        html {
            height: 100%
        }

        body {
            background: var(--bg);
            color: var(--fg);
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none
        }

        .top {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            font-size: 12.5px;
            color: var(--mut)
        }

        .badge,
        .tg {
            background: var(--card);
            border: 1px solid var(--line);
            padding: 5px 13px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 7px;
            color: #cbd5e1;
            font-size: 12.5px
        }

        .tg {
            cursor: pointer
        }

        .tg.on {
            border-color: var(--acc);
            background: #102a3a;
            color: #fff
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--acc);
            box-shadow: 0 0 8px var(--acc)
        }

        .visor {
            width: min(440px, 92vw);
            aspect-ratio: 11/6;
            background: #000;
            border-radius: 38px;
            border: 2px solid #212734;
            box-shadow: 0 28px 70px rgba(0, 0, 0, .92), inset 0 0 30px rgba(255, 255, 255, .03);
            overflow: hidden;
            cursor: pointer;
            touch-action: none
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%
        }

        .hint {
            font-size: 12px;
            color: #64748b;
            text-align: center;
            max-width: 560px;
            line-height: 1.55
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 820px
        }

        .expr-btn {
            background: #151922;
            border: 1.5px solid #272e3b;
            color: #e2e8f0;
            padding: 8px 14px;
            border-radius: 11px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all .16s
        }

        .expr-btn:hover {
            background: #1e2430;
            border-color: #475569;
            transform: translateY(-1px)
        }

        .expr-btn.active {
            background: #122b3a;
            border-color: var(--acc);
            color: #fff;
            box-shadow: 0 0 12px rgba(56, 189, 248, .22)
        }

        .tune {
            width: min(440px, 92vw);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 10px 14px;
            font-size: 12.5px;
            color: #cbd5e1
        }

        .tune summary {
            cursor: pointer
        }

        .tune label {
            display: grid;
            grid-template-columns: 1fr 110px 36px;
            gap: 8px;
            align-items: center;
            margin-top: 8px
        }

        .tune button {
            margin-top: 10px
        }
    </style>
</head>

<body>
    <div class="top">
        <div class="badge"><span class="dot" id="moodDot"></span><span id="moodText">Mood: Idle (Normal)</span></div>
        <button class="tg on" id="autoLifeBtn">Auto-Life: ON</button>
        <button class="tg on" id="soundBtn">Suara Robot: ON</button>
    </div>
    <div class="visor" id="visor"><canvas id="eyeCanvas"></canvas></div>
    <div class="hint">Gerakkan kursor untuk melirik &bull; dekatkan kursor: juling &bull; elus pelan / tahan lama:
        senang &bull; klik beruntun: kaget &rarr; kesal &rarr; pusing &bull; klik dua kali: kedip genit &bull; ketik:
        fokus &bull; diam 21&ndash;28 dtk: mengantuk &rarr; tidur</div>
    <div class="controls" id="controls"></div>

    <script>
        const canvas = document.getElementById('eyeCanvas'), ctx = canvas.getContext('2d'), visor = document.getElementById('visor');
        const moodText = document.getElementById('moodText'), moodDot = document.getElementById('moodDot');
        const autoLifeBtn = document.getElementById('autoLifeBtn'), soundBtn = document.getElementById('soundBtn');
        const W = 440, H = 240, dpr = window.devicePixelRatio || 1;
        canvas.width = W * dpr; canvas.height = H * dpr; ctx.scale(dpr, dpr);
        const calm = matchMedia('(prefers-reduced-motion: reduce)').matches, coarse = matchMedia('(pointer:coarse)').matches;

        // ===== Audio =====
        let audioCtx = null, soundEnabled = true, lastSnd = 0;
        const SND = {
            happy: { a: 'sine', b: 'triangle', f: [540, 960, 1280], d: .25, g: .075 },
            curious: { a: 'sine', b: 'sine', f: [480, 640, 920], d: .24, g: .065 },
            surprised: { a: 'triangle', b: 'sine', f: [420, 1180], d: .17, g: .08 },
            sad: { a: 'sine', b: 'sine', f: [460, 210], d: .36, g: .06 },
            annoyed: { a: 'sawtooth', b: 'triangle', f: [205, 160], d: .24, g: .05 },
            idle: { a: 'sine', b: 'sine', f: [580, 740], d: .11, g: .045 }
        };
        const SND_ALIAS = { thinking: 'curious', sleep: 'sad', dizzy: 'annoyed' };
        function ac() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); startHum() } if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx }
        // Dengung mesin sangat pelan; level mengikuti arousal
        function startHum() {
            try { const c = audioCtx, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(); o.frequency.value = 92; o2.frequency.value = 138.5; g.gain.value = 0; o.connect(g); o2.connect(g); g.connect(c.destination); o.start(); o2.start(); humG = g } catch (e) { }
        }
        // Bunyi servo halus untuk lirikan jauh
        function servo(a) {
            if (!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
            const n = performance.now(); if (n - lastServo < 140) return; lastServo = n;
            try {
                const c = audioCtx, s = c.currentTime, o = c.createOscillator(), g = c.createGain(), f = 800 + Math.random() * 300;
                o.type = 'triangle'; o.frequency.setValueAtTime(f, s); o.frequency.exponentialRampToValueAtTime(f * 1.35, s + .05);
                g.gain.setValueAtTime(.0001, s); g.gain.linearRampToValueAtTime(.006 * T.servo * Math.min(1, a), s + .008); g.gain.exponentialRampToValueAtTime(.0003, s + .06);
                o.connect(g); g.connect(c.destination); o.start(s); o.stop(s + .07);
            } catch (e) { }
        }
        function chirp(type) {
            const nowMs = performance.now(); if (!soundEnabled || nowMs - lastSnd < 70) return; lastSnd = nowMs;
            try {
                const c = ac(), now = c.currentTime, s = SND[SND_ALIAS[type] || type] || SND.idle, p = .92 + Math.random() * .16;
                const o1 = c.createOscillator(), o2 = c.createOscillator(), m = c.createGain(), sg = c.createGain();
                sg.gain.value = .45; o1.type = s.a; o2.type = s.b; o1.connect(m); o2.connect(sg); sg.connect(m); m.connect(c.destination);
                const n = s.f.length;
                s.f.forEach((f, i) => {
                    const tm = now + s.d * i / Math.max(1, n - 1);
                    if (i === 0) { o1.frequency.setValueAtTime(f * p, now); o2.frequency.setValueAtTime(f * 1.5 * p, now) }
                    else { o1.frequency.exponentialRampToValueAtTime(f * p, tm); o2.frequency.exponentialRampToValueAtTime(f * 1.5 * p, tm) }
                });
                m.gain.setValueAtTime(.001, now); m.gain.linearRampToValueAtTime(s.g, now + .02); m.gain.exponentialRampToValueAtTime(.0008, now + s.d + .01);
                o1.start(now); o2.start(now); o1.stop(now + s.d + .02); o2.stop(now + s.d + .02);
            } catch (e) { }
        }
        // Klik kecil saat kedip: lebih pelan dan tidak di setiap kedip
        function tick() {
            if (!soundEnabled || !audioCtx || audioCtx.state !== 'running' || Math.random() > .4) return;
            try {
                const c = audioCtx, n = c.currentTime, o = c.createOscillator(), g = c.createGain();
                o.frequency.value = 1700 + Math.random() * 300; g.gain.setValueAtTime(.006, n); g.gain.exponentialRampToValueAtTime(.0004, n + .025);
                o.connect(g); g.connect(c.destination); o.start(n); o.stop(n + .03);
            } catch (e) { }
        }

        // ===== Preset ekspresi =====
        const E = (w, h, ta, ba, dx = 0, dy = 0, lc = 0, la = 0, rot = 0, sp = 0) => ({ w, h, topArch: ta, botArch: ba, dx, dy, rot, lidCut: lc, lidAngle: la, lidRim: lc ? 1 : 0, spiral: sp });
        const mirrorEye = e => ({ ...e, dx: -e.dx, lidAngle: -e.lidAngle, rot: -e.rot });
        const N = E(46, 86, 23, -23);
        const presets = {
            idle: { label: 'Idle (Normal)', tint: [238, 242, 246], L: N, R: N },
            happy: { label: 'Senang / Selesai', tint: [255, 242, 226], L: E(52, 52, 26, 12, 0, 4), R: E(52, 52, 26, 12, 0, 4) },
            focus: { label: 'Bekerja / Fokus', tint: [200, 230, 255], L: E(48, 82, 24, -24, 2, 2, 24, .42), R: E(48, 82, 24, -24, -2, 2, 24, -.42) },
            thinking: { label: 'Berpikir', tint: [225, 235, 255], asym: true, L: E(46, 74, 23, -23, -2, 6, 20, .25), R: E(46, 86, 23, -23, 0, -4) },
            searching: { label: 'Mencari', tint: [215, 240, 255], L: E(46, 84, 23, -23, -6), R: E(46, 84, 23, -23, -6) },
            curious: { label: 'Penasaran / Tanya', tint: [235, 245, 255], asym: true, L: E(46, 66, 23, -23, -2, 12, 18, .22), R: E(48, 88, 24, -24, 2, -6) },
            surprised: { label: 'Kaget', tint: [255, 255, 255], L: E(56, 90, 28, -28, -2), R: E(56, 90, 28, -28, 2) },
            annoyed: { label: 'Kesal', tint: [255, 212, 200], L: E(48, 76, 24, -24, 2, 6, 26, .48), R: E(48, 76, 24, -24, -2, 6, 26, -.48) },
            sad: { label: 'Error / Sedih', tint: [195, 212, 245], L: E(48, 76, 24, -24, -2, 6, 24, -.45), R: E(48, 76, 24, -24, 2, 6, 24, .45) },
            sleep: { label: 'Tidur', tint: [200, 208, 238], L: E(52, 54, -10, -27, 0, -2), R: E(52, 54, -10, -27, 0, -2) },
            dizzy: { label: 'Pusing', tint: [235, 240, 245], L: E(48, 88, 24, -24, -2, 0, 0, 0, -.22, 1), R: E(48, 88, 24, -24, 2, 0, 0, 0, .22, 1) }
        };
        const controls = document.getElementById('controls');
        for (const k in presets) {
            const b = document.createElement('button'); b.className = 'expr-btn' + (k === 'idle' ? ' active' : ''); b.dataset.state = k; b.textContent = presets[k].label.replace(' (Normal)', '');
            b.addEventListener('pointerdown', () => { endSeq(); setExpression(k, true, false) }); controls.appendChild(b)
        }
        const buttons = controls.querySelectorAll('button');

        // ===== State & fisika =====
        const mkSpring = o => { const s = {}; for (const k in o) s[k] = { v: o[k], vel: 0 }; return s };
        let currentState = 'idle', autoLife = true, isDrowsyPhase = false, yawning = false, away = false, lastInteractionTime = Date.now();
        let springL = mkSpring(presets.idle.L), springR = mkSpring(presets.idle.R);
        let lookTarget = { x: 0, y: 0 }, micro = { x: 0, y: 0 }, lookSmooth = { x: 0, y: 0 }, lookCurL = { x: 0, y: 0 }, lookCurR = { x: 0, y: 0 }, lookVelX = 0, lastBlinkLook = 0;
        let blinkScaleL = 1, blinkScaleR = 1, isBlinkingL = false, isBlinkingR = false, blinkTimers = [], winkTimerL = null, winkTimerR = null;
        let bounceOffset = 0, bounceVel = 0, pop = 0, popVel = 0, cross = 0, crossTarget = 0, t = 0, lastFrame = performance.now();
        let focusDir = 1, tint = [...presets.idle.tint], holding = false, idleSquintSide = 0, sighing = false;
        let asymSide = 1, winkSide = 'R', asymTimer = null, lingerTimer = null;
        let pursuit = { active: false, sx: 0, sy: 0, ex: 0, ey: 0, arc: 0, start: 0, dur: 1400 };
        // Mood kontinu: arousal (energi 0..1) & valence (-1 murung .. +1 ceria), habituasi terhadap tusukan
        let arousal = 0, valence = 0, habit = 0, averting = false, reactT = null, pend = { x: 0, y: 0 };
        let breath = 0, antic = 0, kick = { x: 0, y: 0, vx: 0, vy: 0 }, lastTgt = { x: 0, y: 0 }, bored = false, humG = null, lastServo = 0, motionOn = false, motionAsked = false, motionCool = 0, curiosity = .3, social = .4, energy = .8, trust = .7, lastWary = 0, lastPtrSet = 0, lastKickT = 0;
        const vo = { x: 0, y: 0 };
        // Parameter yang bisa disetel lewat panel (disimpan di localStorage)
        const TD = { react: 130, overshoot: 1.6, sacThresh: 14, drift: 1, visor: 1, antic: 9, blink: 1, hum: 1, servo: 1 };
        const T = { ...TD }; try { Object.assign(T, JSON.parse(localStorage.getItem('emoT') || '{}')) } catch (e) { }
        const excite = (a, v = 0) => { arousal = Math.min(1, arousal + a); valence = Math.max(-1, Math.min(1, valence + v)) };
        const bump = v => { if (!calm) bounceVel = v };

        function stepSpring(sp, tg, dt, k = 155, c = 16.5) {
            const n = 4, h = dt / n;
            for (let i = 0; i < n; i++)for (const key in tg) { const a = -k * (sp[key].v - tg[key]) - c * sp[key].vel; sp[key].vel += a * h; sp[key].v += sp[key].vel * h }
        }
        const damp = (c, tg, l, dt) => c + (tg - c) * (1 - Math.exp(-l * dt));
        const clearTimers = l => { while (l.length) clearTimeout(l.pop()) };

        function flipAsym(withBlink = true) {
            asymSide *= -1;
            if (withBlink && !calm) blink(false, 65);
            if (currentState === 'thinking') {
                lookTarget.x = asymSide * (16 + (Math.random() - .5) * 6);
                lookTarget.y = -13 + (Math.random() - .5) * 4;
            }
        }
        function scheduleAsym() {
            clearTimeout(asymTimer);
            if (!presets[currentState]?.asym) return;
            asymTimer = setTimeout(() => {
                if (presets[currentState]?.asym) { flipAsym(true); scheduleAsym() }
            }, 2400 + Math.random() * 2200);
        }

        // ===== Kedip, wink, micro-saccade, pursuit =====
        function blink(double = false, dur = 85) {
            if (['sleep', 'happy'].includes(currentState)) return;
            clearTimers(blinkTimers); tick();
            const cycle = (after) => {
                isBlinkingR = true; blinkTimers.push(setTimeout(() => isBlinkingL = true, 22));
                blinkTimers.push(setTimeout(() => { isBlinkingR = false; blinkTimers.push(setTimeout(() => isBlinkingL = false, 22)); after && blinkTimers.push(setTimeout(after, 125)) }, dur))
            };
            cycle(double ? () => cycle() : null);
        }
        // Wink hanya mereset sisinya sendiri, tidak memotong kedip lain
        function wink(side = 'R') {
            if (['sleep', 'happy'].includes(currentState)) return;
            tick();
            if (side === 'R') { isBlinkingR = true; clearTimeout(winkTimerR); winkTimerR = setTimeout(() => isBlinkingR = false, 280) }
            else { isBlinkingL = true; clearTimeout(winkTimerL); winkTimerL = setTimeout(() => isBlinkingL = false, 280) }
        }
        // Interval kedip ~log-normal (bergerombol), tergantung mood, melambat saat sedih, lebih sering saat bersemangat
        function nextBlinkDelay() {
            const mood = { focus: 2.2, thinking: 1.4, sad: 1.5, surprised: 3 }[currentState] ?? 1;
            const g = Math.random() + Math.random() + Math.random() - 1.5;
            return Math.max(450, 3200 * Math.exp(g * .8) * mood / (1 + arousal * .5) / T.blink);
        }
        (function nextBlink() {
            setTimeout(() => {
                if (Math.random() < .85) {
                    const r = Math.random();
                    if (isDrowsyPhase) blink(false, 220); else if (r < .22) blink(true); else if (r < .3) wink(Math.random() < .5 ? 'L' : 'R'); else blink();
                }
                nextBlink();
            }, nextBlinkDelay());
        })();
        (function microLoop() {
            if (calm || ['sleep', 'dizzy'].includes(currentState)) micro = { x: 0, y: 0 };
            else micro = { x: (Math.random() - .5) * 2.6, y: (Math.random() - .5) * 1.8 };
            setTimeout(microLoop, 350 + Math.random() * 1300);
        })();
        // Mikro-ekspresi idle: menyipit sebelah, helaan napas, lirik ke atas sekilas
        setInterval(() => {
            if (currentState !== 'idle' || isDrowsyPhase || calm || Math.random() > .6) return;
            const r = Math.random();
            if (r < .4) { idleSquintSide = Math.random() < .5 ? -1 : 1; setTimeout(() => idleSquintSide = 0, 1100 + Math.random() * 600) }
            else if (r < .7) { sighing = true; bump(35); setTimeout(() => sighing = false, 900) }
            else if (!averting) { const keep = { ...lookTarget }; lookTarget.x = (Math.random() - .5) * 14; lookTarget.y = -13; setTimeout(() => { if (currentState === 'idle') { lookTarget.x = keep.x; lookTarget.y = keep.y } }, 700) }
        }, 6500);
        // Gaze aversion: kalau ditatap kursor diam terlalu lama, sesekali melirik menjauh lalu kembali
        setInterval(() => {
            if (averting || calm || currentState !== 'idle' || isDrowsyPhase || crossTarget < .55 || Date.now() - lastMouse.time < 2500 || Math.random() > .2 + (1 - trust) * .5) return;
            averting = true; const keep = { ...lookTarget };
            lookTarget.x = (Math.random() < .5 ? -1 : 1) * 20; lookTarget.y = 8; crossTarget = 0;
            setTimeout(() => { averting = false; lookTarget.x = keep.x; lookTarget.y = keep.y }, 600 + Math.random() * 500);
        }, 900);
        function gazeLoop() {
            let hold = 700 + Math.random() * 1800;
            const pointerQuiet = Date.now() - lastMouse.time > 1500;
            if (averting) { }
            else if (currentState === 'searching') { pursuit.active = false; lookTarget.x = (lookTarget.x >= 0 ? -1 : 1) * (20 + Math.random() * 14); lookTarget.y = (Math.random() - .5) * 10; hold = 500 + Math.random() * 700 }
            else if (currentState === 'thinking') { pursuit.active = false; lookTarget.x = asymSide * (16 + (Math.random() - .5) * 8); lookTarget.y = -13 + (Math.random() - .5) * 5; hold = 900 + Math.random() * 900 }
            else if (bored && !(motionOn && coarse) && Math.random() < .3) { pursuit.active = false; lookTarget.x = 0; lookTarget.y = 3; hold = 2600 }
            else if (currentState === 'idle' && !isDrowsyPhase && pointerQuiet && !(motionOn && coarse)) {
                const r = Math.random();
                if (r < .22 && !calm) {
                    const dir = Math.random() < .5 ? 1 : -1;
                    pursuit = { active: true, sx: -dir * 20, sy: (Math.random() - .5) * 10, ex: dir * 22, ey: (Math.random() - .5) * 10, arc: (Math.random() - .5) * 14, start: performance.now(), dur: 1300 + Math.random() * 500 };
                    hold = pursuit.dur + 500;
                } else if (r < .52) { pursuit.active = false; lookTarget.x = 0; lookTarget.y = 0; hold = 1200 + Math.random() * 2000 }
                else { pursuit.active = false; lookTarget.x = (Math.random() - .5) * 34; lookTarget.y = (Math.random() - .5) * 16; hold = 500 + Math.random() * 1400 }
            }
            setTimeout(gazeLoop, hold);
        }
        setTimeout(gazeLoop, 1200);
        setInterval(() => { if (currentState === 'focus') { focusDir *= -1; lookTarget.x = focusDir * 14; lookTarget.y = 4 + (Math.random() - .5) * 4 } }, 550);
        setInterval(() => {
            if (yawning || !(isDrowsyPhase || ((bored || energy < .35) && Math.random() < .35))) return;
            yawning = true; bump(90); energy = Math.min(1, energy + .3); if (currentState === 'idle' && !isDrowsyPhase) { lookTarget.x = -14; lookTarget.y = -12 }
            setTimeout(() => yawning = false, 950);
        }, 4200);

        // ===== Siklus auto-life =====
        setInterval(() => {
            if (!autoLife) return;
            const idle = (Date.now() - lastInteractionTime) / 1000 + (away ? 10 : 0);
            bored = idle > 8 && idle <= 21 && currentState === 'idle' && !isDrowsyPhase;
            if (idle > 28 && currentState !== 'sleep') { isDrowsyPhase = false; setExpression('sleep', true, true) }
            else if (idle > 21 && idle <= 28 && currentState !== 'sleep') {
                if (!isDrowsyPhase) { isDrowsyPhase = true; lookTarget = { x: 0, y: 6 }; moodText.textContent = 'Mood: Mengantuk...'; moodDot.style.background = '#a855f7'; chirp('sleep') }
            } else if (idle > 13 && idle <= 21 && currentState === 'idle') setExpression('searching', true, true);
        }, 1500);

        // ===== Emosi sementara berurutan & bangun tidur =====
        let seqTimer = null, seqActive = false, restoreState = 'idle';
        function endSeq() { clearTimeout(seqTimer); seqActive = false }
        function seq(steps, back) {
            clearTimeout(seqTimer);
            if (!seqActive) { restoreState = back || (['sleep', 'dizzy'].includes(currentState) ? 'idle' : currentState); seqActive = true }
            let i = 0;
            (function next() {
                if (i < steps.length) { setExpression(steps[i][0], true, false); seqTimer = setTimeout(next, steps[i++][1]) }
                else { const was = currentState; seqActive = false; setExpression(restoreState, true, false); if (restoreState === 'idle' && ['dizzy', 'annoyed', 'surprised'].includes(was)) { sighing = true; setTimeout(() => sighing = false, 900) } }
            })();
        }
        const flash = (s, ms = 1800) => seq([[s, ms]]);
        function wakeUp(targetAfter = 'idle') {
            isDrowsyPhase = false;
            lastInteractionTime = Date.now();
            seq([['surprised', 420], ['annoyed', 380]], targetAfter);
            setTimeout(() => { if (!['sleep', 'dizzy'].includes(currentState)) blink(true, 75) }, 880);
        }

        // ===== Interaksi =====
        let lastMouse = { x: 0, y: 0, time: Date.now() }, shakeScore = 0, petDistance = 0;

                asymSide = changed ? (Math.random() < .5 ? 1 : -1) : (asymSide * -1);
                scheduleAsym();
                if (state === 'thinking') lookTarget = { x: asymSide * 16, y: -13 };
            } else {
                clearTimeout(asymTimer);
            }

            if (changed) {
                if (!isAuto) antic = 1;
                if (state === 'surprised') setTimeout(() => blink(true, 75), 650);
                if (prevS === 'happy' && state === 'idle') setTimeout(() => wink('R'), 350);
                if (state === 'happy') { excite(.4, .5); trust = Math.min(1, trust + .2); social = Math.max(0, social - .4) }
                else if (state === 'surprised') excite(.3);
                else if (state === 'annoyed') excite(.25, -.4);
                else if (state === 'dizzy') excite(.3, -.3);
                else if (state === 'sad') excite(0, -.3);
            }

            const hs = state === 'surprised' ? 1 - habit * .6 : 1;
            if ((changed || presets[state].asym) && !['sleep', 'happy'].includes(state)) { pop = .16 * hs; popVel = 0; bump(-115 * hs) }
            else if (changed && state === 'happy') { bump(-95) }
            chirp(state);
            if (['sleep', 'dizzy', 'happy'].includes(state)) lookTarget = { x: 0, y: 0 };
            if (state !== 'idle' && state !== 'curious') crossTarget = 0;
            if (updateUI) {
                moodText.textContent = `Mood: ${presets[state].label}`;
                const c = isAuto ? '#a855f7' : '#38bdf8'; moodDot.style.background = c; moodDot.style.boxShadow = `0 0 8px ${c}`;
                buttons.forEach(b => b.classList.toggle('active', b.dataset.state === state));
            }
        }
        autoLifeBtn.addEventListener('click', () => { autoLife = !autoLife; isDrowsyPhase = false; autoLifeBtn.textContent = `Auto-Life: ${autoLife ? 'ON' : 'OFF'}`; autoLifeBtn.classList.toggle('on', autoLife) });
        soundBtn.addEventListener('click', () => { soundEnabled = !soundEnabled; soundBtn.textContent = `Suara Robot: ${soundEnabled ? 'ON' : 'OFF'}`; soundBtn.classList.toggle('on', soundEnabled); if (soundEnabled) chirp('happy') });
        (function panel() {
            const defs = [['react', 'Jeda reaksi (ms)', 0, 300, 10], ['overshoot', 'Overshoot saccade', 0, 3, .1], ['sacThresh', 'Ambang saccade', 6, 30, 1], ['drift', 'Drift', 0, 2.5, .1], ['visor', 'Gerak visor', 0, 3, .1], ['antic', 'Antisipasi', 0, 16, 1], ['blink', 'Frekuensi kedip', .4, 2.5, .1], ['hum', 'Dengung (0 = mati)', 0, 3, .1], ['servo', 'Servo (0 = mati)', 0, 3, .1]];
            const d = document.createElement('details'); d.className = 'tune'; d.innerHTML = '<summary>Penyetel</summary>';
            defs.forEach(([k, l, mn, mx, st]) => {
                const r = document.createElement('label'), v = document.createElement('span'), i = document.createElement('input');
                v.textContent = T[k]; i.type = 'range'; i.min = mn; i.max = mx; i.step = st; i.value = T[k];
                i.addEventListener('input', () => { T[k] = +i.value; v.textContent = T[k]; try { localStorage.setItem('emoT', JSON.stringify(T)) } catch (e) { } });
                r.append(l, i, v); d.appendChild(r);
            });
            const b = document.createElement('button'); b.textContent = 'Reset'; b.className = 'expr-btn';
            b.addEventListener('click', () => { Object.assign(T, TD); try { localStorage.removeItem('emoT') } catch (e) { } d.querySelectorAll('input').forEach((i, n) => { i.value = T[defs[n][0]]; i.nextSibling.textContent = T[defs[n][0]] }) });
            d.appendChild(b); document.body.appendChild(d);
        })();
        window.setRobotExpression = s => { endSeq(); setExpression(s, true, false) };
        requestAnimationFrame(animate);
    </script>
