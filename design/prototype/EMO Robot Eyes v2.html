<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMO Robot Eyes - 11 Ekspresi & 8 Aksesoris</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0a0d13;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 20px;
      user-select: none;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      color: #94a3b8;
    }

    .status-badge {
      background: #141923;
      border: 1px solid #242c3b;
      padding: 5px 13px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      transition: all 0.25s ease;
    }

    .toggle-btn {
      background: #141923;
      border: 1px solid #242c3b;
      color: #cbd5e1;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-btn:hover {
      border-color: #475569;
    }

    .toggle-btn.on {
      border-color: #38bdf8;
      background: #102a3a;
      color: #ffffff;
    }

    .visor {
      width: 440px;
      height: 250px;
      background: #000000;
      border-radius: 38px;
      border: 2px solid #212734;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.92), inset 0 0 30px rgba(255, 255, 255, 0.03);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hint {
      font-size: 12px;
      color: #64748b;
      text-align: center;
      max-width: 560px;
      line-height: 1.5;
    }

    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: -8px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      max-width: 820px;
    }

    button.ctrl-btn {
      background: #151922;
      border: 1.5px solid #272e3b;
      color: #e2e8f0;
      padding: 7px 13px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    button.ctrl-btn:hover {
      background: #1e2430;
      border-color: #475569;
      transform: translateY(-1px);
    }

    button.ctrl-btn.active {
      background: #122b3a;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.22);
    }

    button.acc-btn.active {
      background: #1d1b38;
      border-color: #a78bfa;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(167, 139, 250, 0.22);
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <div class="status-badge">
      <span class="dot" id="moodDot"></span>
      <span id="moodText">Mood: Idle (Normal)</span>
    </div>
    <button class="toggle-btn on" id="autoLifeBtn">Auto-Life: ON</button>
    <button class="toggle-btn on" id="soundBtn">Suara Robot: ON</button>
  </div>

  <div class="visor" id="visor" title="Klik, elus perlahan, atau goyangkan kursor cepat!">
    <canvas id="eyeCanvas"></canvas>
  </div>

  <div class="hint">
    Gerakkan kursor untuk melirik 3D • Usap/elus pelan di atas layar agar senang • Goyangkan cepat untuk pusing
  </div>

  <div class="section-label">Ekspresi Utama</div>
  <div class="controls" id="controlsExpr">
    <button class="ctrl-btn expr-btn active" data-state="idle">Idle (Normal)</button>
    <button class="ctrl-btn expr-btn" data-state="happy">Senang / Selesai</button>
    <button class="ctrl-btn expr-btn" data-state="focus">Bekerja / Fokus</button>
    <button class="ctrl-btn expr-btn" data-state="thinking">Berpikir</button>
    <button class="ctrl-btn expr-btn" data-state="searching">Mencari</button>
    <button class="ctrl-btn expr-btn" data-state="curious">Penasaran / Tanya</button>
    <button class="ctrl-btn expr-btn" data-state="surprised">Kaget</button>
    <button class="ctrl-btn expr-btn" data-state="annoyed">Kesal</button>
    <button class="ctrl-btn expr-btn" data-state="sad">Error / Sedih</button>
    <button class="ctrl-btn expr-btn" data-state="sleep">Tidur</button>
    <button class="ctrl-btn expr-btn" data-state="dizzy">Pusing</button>
  </div>

  <div class="section-label">Kustomisasi Aksesoris</div>
  <div class="controls" id="controlsAcc">
    <button class="ctrl-btn acc-btn active" data-acc="none">Polos (Default)</button>
    <button class="ctrl-btn acc-btn" data-acc="antenna">Antena Robot</button>
    <button class="ctrl-btn acc-btn" data-acc="cat_ears">Telinga Kucing</button>
    <button class="ctrl-btn acc-btn" data-acc="crown">Mahkota Mini</button>
    <button class="ctrl-btn acc-btn" data-acc="round_glasses">Kacamata Bulat</button>
    <button class="ctrl-btn acc-btn" data-acc="square_glasses">Kacamata Kotak</button>
    <button class="ctrl-btn acc-btn" data-acc="halo">Halo Cincin</button>
    <button class="ctrl-btn acc-btn" data-acc="headphones">Headphone</button>
  </div>

  <script>
    const canvas = document.getElementById('eyeCanvas');
    const ctx = canvas.getContext('2d');
    const visor = document.getElementById('visor');
    const moodText = document.getElementById('moodText');
    const moodDot = document.getElementById('moodDot');
    const autoLifeBtn = document.getElementById('autoLifeBtn');
    const soundBtn = document.getElementById('soundBtn');
    const exprButtons = document.querySelectorAll('button.expr-btn');
    const accButtons = document.querySelectorAll('button.acc-btn');

    const W = 440;
    const H = 250;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);

    // ================= 1. MANAJEMEN TIMER ANTI-BENTROK =================
    let blinkTimers = [];
    let tempMoodTimeout = null;

    function clearTimerList(list) {
      while (list.length) clearTimeout(list.pop());
    }

    // ================= 2. SINTESIS VOKAL DUAL-OSCILLATOR =================
    let audioCtx = null;
    let soundEnabled = true;

    function playDualChirp(type) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const masterGain = audioCtx.createGain();
        const subGain = audioCtx.createGain();

        subGain.gain.setValueAtTime(0.45, now);
        osc1.connect(masterGain);
        osc2.connect(subGain);
        subGain.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        if (type === 'happy') {
          osc1.type = 'sine';
          osc2.type = 'triangle';
          osc1.frequency.setValueAtTime(540, now);
          osc1.frequency.exponentialRampToValueAtTime(960, now + 0.11);
          osc1.frequency.exponentialRampToValueAtTime(1280, now + 0.22);

          osc2.frequency.setValueAtTime(810, now);
          osc2.frequency.exponentialRampToValueAtTime(1440, now + 0.11);
          osc2.frequency.exponentialRampToValueAtTime(1920, now + 0.22);

          masterGain.gain.setValueAtTime(0.001, now);
          masterGain.gain.linearRampToValueAtTime(0.075, now + 0.02);
          masterGain.gain.exponentialRampToValueAtTime(0.0008, now + 0.25);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.25);
          osc2.stop(now + 0.25);
        } else if (type === 'curious' || type === 'thinking') {
          osc1.type = 'sine';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(480, now);
          osc1.frequency.setValueAtTime(640, now + 0.09);
          osc1.frequency.exponentialRampToValueAtTime(920, now + 0.22);

          osc2.frequency.setValueAtTime(720, now);
          osc2.frequency.setValueAtTime(960, now + 0.09);
          osc2.frequency.exponentialRampToValueAtTime(1380, now + 0.22);

          masterGain.gain.setValueAtTime(0.001, now);
          masterGain.gain.linearRampToValueAtTime(0.065, now + 0.02);
          masterGain.gain.exponentialRampToValueAtTime(0.0008, now + 0.24);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.24);
          osc2.stop(now + 0.24);
        } else if (type === 'surprised') {
          osc1.type = 'triangle';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(420, now);
          osc1.frequency.exponentialRampToValueAtTime(1180, now + 0.14);
          osc2.frequency.setValueAtTime(630, now);
          osc2.frequency.exponentialRampToValueAtTime(1770, now + 0.14);

          masterGain.gain.setValueAtTime(0.001, now);
          masterGain.gain.linearRampToValueAtTime(0.08, now + 0.015);
          masterGain.gain.exponentialRampToValueAtTime(0.0008, now + 0.17);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.17);
          osc2.stop(now + 0.17);
        } else if (type === 'sad' || type === 'sleep') {
          osc1.type = 'sine';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(460, now);
          osc1.frequency.exponentialRampToValueAtTime(210, now + 0.34);
          osc2.frequency.setValueAtTime(550, now);
          osc2.frequency.exponentialRampToValueAtTime(250, now + 0.34);

          masterGain.gain.setValueAtTime(0.001, now);
          masterGain.gain.linearRampToValueAtTime(0.06, now + 0.03);
          masterGain.gain.exponentialRampToValueAtTime(0.0008, now + 0.36);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.36);
          osc2.stop(now + 0.36);
        } else if (type === 'annoyed' || type === 'dizzy') {
          osc1.type = 'sawtooth';
          osc2.type = 'triangle';
          osc1.frequency.setValueAtTime(205, now);
          osc1.frequency.linearRampToValueAtTime(160, now + 0.22);
          osc2.frequency.setValueAtTime(214, now);
          osc2.frequency.linearRampToValueAtTime(168, now + 0.22);

          masterGain.gain.setValueAtTime(0.001, now);
          masterGain.gain.linearRampToValueAtTime(0.05, now + 0.02);
          masterGain.gain.exponentialRampToValueAtTime(0.0008, now + 0.24);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.24);
          osc2.stop(now + 0.24);
        } else {
          osc1.type = 'sine';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(580, now);
          osc1.frequency.exponentialRampToValueAtTime(740, now + 0.09);
          osc2.frequency.setValueAtTime(870, now);
          osc2.frequency.exponentialRampToValueAtTime(1110, now + 0.09);

          masterGain.gain.setValueAtTime(0.001, now);
          masterGain.gain.linearRampToValueAtTime(0.045, now + 0.015);
          masterGain.gain.exponentialRampToValueAtTime(0.0008, now + 0.11);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.11);
          osc2.stop(now + 0.11);
        }
      } catch (e) { }
    }

    // ================= 3. DEFINISI 11 EKSPRESI (UNIFIED PARAMETRIC SHAPE) =================
    const presets = {
      idle: {
        label: 'Idle (Normal)',
        L: { w: 46, h: 84, topArch: 23, botArch: -23, dx: 0, dy: 0, rot: 0, lidCut: 0, lidAngle: 0, lidRim: 0, spiral: 0 },
        R: { w: 46, h: 84, topArch: 23, botArch: -23, dx: 0, dy: 0, rot: 0, lidCut: 0, lidAngle: 0, lidRim: 0, spiral: 0 }
      },
      happy: {
        label: 'Senang / Selesai',
        L: { w: 58, h: 58, topArch: 28, botArch: 13, dx: 0, dy: 4, rot: 0, lidCut: 0, lidAngle: 0, lidRim: 0, spiral: 0 },
        R: { w: 58, h: 58, topArch: 28, botArch: 13, dx: 0, dy: 4, rot: 0, lidCut: 0, lidAngle: 0, lidRim: 0, spiral: 0 }
      },
      focus: {
        label: 'Bekerja / Fokus',
        L: { w: 48, h: 80, topArch: 24, botArch: -24, dx: 2, dy: 2, rot: 0, lidCut: 24, lidAngle: 0.42, lidRim: 1, spiral: 0 },
        R: { w: 48, h: 80, topArch: 24, botArch: -24, dx: -2, dy: 2, rot: 0, lidCut: 24, lidAngle: -0.42, lidRim: 1, spiral: 0 }
      },
      thinking: {
        label: 'Berpikir',
        L: { w: 46, h: 72, topArch: 23, botArch: -23, dx: -2, dy: 6, rot: 0, lidCut: 20, lidAngle: 0.25, lidRim: 1, spiral: 0 },
        R: { w: 46, h: 84, topArch: 23, botArch: -23, dx: 0, dy: -4, rot: 0, lidCut: 0, lidAngle: 0, lidRim: 0, spiral: 0 }
      },
      searching: {
        label: 'Mencari',
        L: { w: 46, h: 82, topArch: 23, botArch: -23, dx: -6, dy: 0, rot: 0, lidCut: 0, lidAngle: 0, lidRim: 0, spiral: 0 },
        R: { w: 46, h: 82, topArch: 23, botArch: -23, dx: -6, dy: 0, rot: 0, lidCut: 0, lidAngle: 0, lidRim: 0, spiral: 0 }
      },
      curious: {
        label: 'Penasaran / Tanya',
        L: { w: 46, h: 66, topArch: 23, botArch: -23, dx: -2, dy: 12, rot: 0, lidCut: 18, lidAngle: 0.22, lidRim: 1, spiral: 0 },
        R: { w: 48, h: 86, topArch: 24, botArch: -24, dx: 2, dy: -6, rot: 0, lidCut: 0, lidAngle: 0, lidRim: 0, spiral: 0 }
      },
      surprised: {
        label: 'Kaget',
        L: { w: 58, h: 88, topArch: 29, botArch: -29, dx: -2, dy: 0, rot: 0, lidCut: 0, lidAngle: 0, lidRim: 0, spiral: 0 },
        R: { w: 58, h: 88, topArch: 29, botArch: -29, dx: 2, dy: 0, rot: 0, lidCut: 0, lidAngle: 0, lidRim: 0, spiral: 0 }
      },
      annoyed: {
        label: 'Kesal',
        L: { w: 48, h: 74, topArch: 24, botArch: -24, dx: 2, dy: 6, rot: 0, lidCut: 26, lidAngle: 0.48, lidRim: 1, spiral: 0 },
        R: { w: 48, h: 74, topArch: 24, botArch: -24, dx: -2, dy: 6, rot: 0, lidCut: 26, lidAngle: -0.48, lidRim: 1, spiral: 0 }
      },
      sad: {
        label: 'Error / Sedih',
        L: { w: 48, h: 74, topArch: 24, botArch: -24, dx: -2, dy: 6, rot: 0, lidCut: 24, lidAngle: -0.45, lidRim: 1, spiral: 0 },
        R: { w: 48, h: 74, topArch: 24, botArch: -24, dx: 2, dy: 6, rot: 0, lidCut: 24, lidAngle: 0.45, lidRim: 1, spiral: 0 }
      },
      sleep: {
        label: 'Tidur',
        L: { w: 60, h: 60, topArch: -13, botArch: -28, dx: 0, dy: -4, rot: 0, lidCut: 0, lidAngle: 0, lidRim: 0, spiral: 0 },
        R: { w: 60, h: 60, topArch: -13, botArch: -28, dx: 0, dy: -4, rot: 0, lidCut: 0, lidAngle: 0, lidRim: 0, spiral: 0 }
      },
      dizzy: {
        label: 'Pusing',
        L: { w: 48, h: 86, topArch: 24, botArch: -24, dx: -2, dy: 0, rot: -0.22, lidCut: 0, lidAngle: 0, lidRim: 0, spiral: 1 },
        R: { w: 48, h: 86, topArch: 24, botArch: -24, dx: 2, dy: 0, rot: 0.22, lidCut: 0, lidAngle: 0, lidRim: 0, spiral: 1 }
      }
    };

    // ================= 4. FISIKA PEGAS SUB-STEPPED & MIKRO-PERILAKU =================
    function createSpringState(initial) {
      const state = {};
      for (const k in initial) {
        state[k] = { v: initial[k], vel: 0 };
      }
      return state;
    }

    let currentState = 'idle';
    let currentAccessory = 'none';
    let autoLife = true;
    let isDrowsyPhase = false;
    let lastInteractionTime = Date.now();

    let springL = createSpringState(presets.idle.L);
    let springR = createSpringState(presets.idle.R);

    let lookTarget = { x: 0, y: 0 };
    let microSaccade = { x: 0, y: 0 };
    let lookSmooth = { x: 0, y: 0 };
    let lookCurL = { x: 0, y: 0 };
    let lookCurR = { x: 0, y: 0 };
    let lookVelX = 0;

    let blinkScaleL = 1;
    let blinkScaleR = 1;
    let isBlinkingL = false;
    let isBlinkingR = false;

    let bounceOffset = 0;
    let bounceVel = 0;
    let accSpringY = 0; // Follow-through pegas khusus aksesoris
    let accSpringVel = 0;
    let t = 0;
    let lastFrameTime = performance.now();

    let focusScanDir = 1;
    let glitchState = { active: false, x: 0, y: 0, alpha: 1 };

    function stepSpringSmooth(springObj, targetObj, dtSec, stiffness = 155, damping = 16.5) {
      const steps = 4;
      const h = dtSec / steps;
      for (let i = 0; i < steps; i++) {
        for (const k in targetObj) {
          const disp = springObj[k].v - targetObj[k];
          const accel = -stiffness * disp - damping * springObj[k].vel;
          springObj[k].vel += accel * h;
          springObj[k].v += springObj[k].vel * h;
        }
      }
    }

    function damp(current, target, lambda, dtSec) {
      return current + (target - current) * (1 - Math.exp(-lambda * dtSec));
    }

    function blink(double = false) {
      if (['sleep', 'happy'].includes(currentState)) return;

      clearTimerList(blinkTimers);
      isBlinkingR = true;
      blinkTimers.push(setTimeout(() => (isBlinkingL = true), 22));

      blinkTimers.push(
        setTimeout(() => {
          isBlinkingR = false;
          blinkTimers.push(setTimeout(() => (isBlinkingL = false), 22));

          if (double) {
            blinkTimers.push(
              setTimeout(() => {
                isBlinkingR = true;
                blinkTimers.push(setTimeout(() => (isBlinkingL = true), 22));
                blinkTimers.push(
                  setTimeout(() => {
                    isBlinkingR = false;
                    blinkTimers.push(setTimeout(() => (isBlinkingL = false), 22));
                  }, 85)
                );
              }, 125)
            );
          }
        }, 85)
      );
    }

    setInterval(() => {
      if (Math.random() < 0.8) blink(Math.random() < 0.28);
    }, 3100);

    setInterval(() => {
      if (['sleep', 'dizzy'].includes(currentState)) {
        microSaccade = { x: 0, y: 0 };
        return;
      }
      microSaccade = {
        x: (Math.random() - 0.5) * 3.2,
        y: (Math.random() - 0.5) * 2.4
      };
    }, 800);

    setInterval(() => {
      if (currentState === 'searching') {
        lookTarget.x = (lookTarget.x >= 0 ? -1 : 1) * (20 + Math.random() * 14);
        lookTarget.y = (Math.random() - 0.5) * 10;
      } else if (currentState === 'thinking') {
        lookTarget.x = 16 + (Math.random() - 0.5) * 8;
        lookTarget.y = -13 + (Math.random() - 0.5) * 5;
      } else if (currentState === 'idle' && !isDrowsyPhase) {
        if (Math.random() < 0.6) {
          lookTarget.x = (Math.random() - 0.5) * 22;
          lookTarget.y = (Math.random() - 0.5) * 12;
        }
      }
    }, 1350);

    setInterval(() => {
      if (currentState === 'focus') {
        focusScanDir *= -1;
        lookTarget.x = focusScanDir * 14;
        lookTarget.y = 4 + (Math.random() - 0.5) * 4;
      }
    }, 550);

    setInterval(() => {
      if (currentState === 'sad' && Math.random() < 0.45) {
        glitchState = {
          active: true,
          x: (Math.random() - 0.5) * 7,
          y: (Math.random() - 0.5) * 3,
          alpha: 0.45 + Math.random() * 0.3
        };
        setTimeout(() => {
          glitchState = { active: false, x: 0, y: 0, alpha: 1 };
        }, 75);
      }
    }, 1100);

    // ================= 5. SIKLUS PERILAKU OTOMATIS =================
    setInterval(() => {
      if (!autoLife) return;
      const idleSeconds = (Date.now() - lastInteractionTime) / 1000;

      if (idleSeconds > 28 && currentState !== 'sleep') {
        isDrowsyPhase = false;
        setExpression('sleep', true, true);
      } else if (idleSeconds > 21 && idleSeconds <= 28 && currentState !== 'sleep') {
        if (!isDrowsyPhase) {
          isDrowsyPhase = true;
          lookTarget = { x: 0, y: 6 };
          moodText.textContent = 'Mood: Mengantuk...';
          moodDot.style.background = '#a855f7';
          moodDot.style.boxShadow = '0 0 8px #a855f7';
          playDualChirp('sleep');
        }
      } else if (idleSeconds > 13 && idleSeconds <= 21 && currentState === 'idle') {
        setExpression('searching', true, true);
      }
    }, 1500);

    // ================= 6. INTERAKSI KURSOR, GESTUR ELUS & KLIK =================
    let lastMouse = { x: 0, y: 0, time: Date.now() };
    let shakeScore = 0;
    let petDistance = 0;

    function handlePointer(clientX, clientY) {
      const now = Date.now();
      const dt = Math.max(1, now - lastMouse.time);
      const dist = Math.hypot(clientX - lastMouse.x, clientY - lastMouse.y);
      const speed = dist / dt;

      lastMouse = { x: clientX, y: clientY, time: now };

      const rect = visor.getBoundingClientRect();
      const insideVisor =
        clientX >= rect.left &&
        clientX <= rect.right &&
        clientY >= rect.top &&
        clientY <= rect.bottom;

      if (currentState === 'sleep' || isDrowsyPhase) {
        if (speed > 0.5) {
          isDrowsyPhase = false;
          setExpression('idle', true, false);
        }
        return;
      }

      lastInteractionTime = now;

      if (speed > 3.2) {
        shakeScore += 1;
        petDistance = 0;
        if (shakeScore > 14 && currentState !== 'dizzy') {
          shakeScore = 0;
          const prev = currentState;
          setExpression('dizzy', true, false);
          clearTimeout(tempMoodTimeout);
          tempMoodTimeout = setTimeout(() => {
            if (currentState === 'dizzy') setExpression(prev, true, false);
          }, 2600);
          return;
        }
      } else {
        shakeScore = Math.max(0, shakeScore - 0.5);
      }

      if (insideVisor && speed > 0.06 && speed < 1.35 && currentState !== 'dizzy') {
        petDistance += dist;
        if (petDistance > 260 && currentState !== 'happy') {
          petDistance = 0;
          const prev = currentState;
          setExpression('happy', true, false);
          clearTimeout(tempMoodTimeout);
          tempMoodTimeout = setTimeout(() => {
            if (currentState === 'happy') setExpression(prev, true, false);
          }, 2400);
        }
      } else {
        petDistance = Math.max(0, petDistance - 8);
      }

      if (['dizzy', 'focus', 'thinking'].includes(currentState)) return;

      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const nx = Math.max(-1, Math.min(1, (clientX - cx) / 260));
      const ny = Math.max(-1, Math.min(1, (clientY - cy) / 200));
      lookTarget.x = nx * 28;
      lookTarget.y = ny * 16;
    }

    window.addEventListener('pointermove', (e) => handlePointer(e.clientX, e.clientY));
    window.addEventListener('pointerleave', () => {
      petDistance = 0;
      if (['idle', 'curious', 'surprised'].includes(currentState) && !isDrowsyPhase) {
        lookTarget = { x: 0, y: 0 };
      }
    });

    visor.addEventListener('pointerdown', (e) => {
      handlePointer(e.clientX, e.clientY);
      lastInteractionTime = Date.now();

      if (currentState === 'sleep' || isDrowsyPhase) {
        isDrowsyPhase = false;
        setExpression('idle', true, false);
        return;
      }

      bounceVel = -220;
      accSpringVel = -260;
      playDualChirp('surprised');
      blink(false);
    });

    // ================= 7. FUNGSI RENDER MATA & 8 AKSESORIS GEOMETRIS =================
    function traceParametricEye(w, h, topArch, botArch) {
      const halfW = w / 2;
      const sideHalfH = Math.max(0, (h - w) / 2);
      const k = 1.3333;

      ctx.beginPath();
      ctx.moveTo(-halfW, -sideHalfH);
      ctx.bezierCurveTo(
        -halfW,
        -sideHalfH - topArch * k,
        halfW,
        -sideHalfH - topArch * k,
        halfW,
        -sideHalfH
      );
      ctx.lineTo(halfW, sideHalfH);
      ctx.bezierCurveTo(
        halfW,
        sideHalfH - botArch * k,
        -halfW,
        sideHalfH - botArch * k,
        -halfW,
        sideHalfH
      );
      ctx.closePath();
    }

    function drawEye(baseX, baseY, s, isLeft) {
      ctx.save();

      const lookCur = isLeft ? lookCurL : lookCurR;
      const blinkScale = isLeft ? blinkScaleL : blinkScaleR;

      const normLook = lookCur.x / 28;
      const isNearSide = (isLeft && normLook < 0) || (!isLeft && normLook > 0);
      const perspectiveScaleX = isNearSide ? 1 - Math.abs(normLook) * 0.12 : 1 + Math.abs(normLook) * 0.04;
      const parallax = isNearSide ? 1.14 : 0.88;

      let dizzyScale = 1;
      let dizzyWobble = 0;
      if (s.spiral.v > 0.1) {
        const phase = isLeft ? 0 : Math.PI;
        dizzyScale = 1 + Math.sin(t * 7 + phase) * 0.07 * s.spiral.v;
        dizzyWobble = Math.sin(t * 6 + phase) * 0.06 * s.spiral.v;
      }

      const gx = glitchState.active ? glitchState.x * (isLeft ? 1 : -0.6) : 0;
      const gy = glitchState.active ? glitchState.y : 0;
      ctx.globalAlpha = glitchState.active ? glitchState.alpha : 1;

      const x = baseX + s.dx.v + lookCur.x * parallax + gx;
      const y = baseY + s.dy.v + lookCur.y + bounceOffset + gy;

      ctx.translate(x, y);
      ctx.rotate(s.rot.v + dizzyWobble);

      const isCrescent = s.botArch.v > 2 || s.topArch.v < -2;
      const syBlink = isCrescent ? 1 : Math.max(0.05, blinkScale);
      const stretchFromLook = Math.min(0.12, Math.abs(lookVelX) * 0.0004);
      const sx = perspectiveScaleX * dizzyScale * (1 + (1 - syBlink) * 0.14 + stretchFromLook);
      const sy = syBlink * dizzyScale * (1 - stretchFromLook * 0.45);

      ctx.scale(sx, sy);

      const w = s.w.v;
      const h = s.h.v;
      const topArch = s.topArch.v;
      const botArch = s.botArch.v;

      // Layer 1: Wide Bloom Putih Lembut
      ctx.save();
      ctx.fillStyle = '#eef2f6';
      ctx.shadowColor = 'rgba(255, 255, 255, 0.45)';
      ctx.shadowBlur = 24;
      traceParametricEye(w, h, topArch, botArch);
      ctx.fill();
      ctx.restore();

      // Layer 2: Inti Putih Padat + Tight Glow
      ctx.save();
      ctx.fillStyle = '#f1f5f9';
      ctx.shadowColor = 'rgba(255, 255, 255, 0.75)';
      ctx.shadowBlur = 8;
      traceParametricEye(w, h, topArch, botArch);
      ctx.fill();
      ctx.restore();

      // Spiral (Pusing)
      if (s.spiral.v > 0.05) {
        ctx.save();
        traceParametricEye(w, h, topArch, botArch);
        ctx.clip();

        ctx.strokeStyle = `rgba(35, 42, 54, ${s.spiral.v * 0.72})`;
        ctx.lineWidth = 3.2;
        ctx.lineCap = 'round';
        ctx.rotate(t * 4.5 * (isLeft ? 1 : -1));

        ctx.beginPath();
        for (let a = 0; a < Math.PI * 5.2; a += 0.18) {
          const rad = a * 1.15;
          const px = Math.cos(a) * rad;
          const py = Math.sin(a) * rad;
          if (a === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.restore();
      }

      // Kelopak Atas & Bibir Menonjol
      if (s.lidCut.v > 0.5) {
        const cutY = -h / 2 + s.lidCut.v;
        const angle = s.lidAngle.v;

        ctx.save();
        ctx.translate(0, cutY);
        ctx.rotate(angle);
        ctx.fillStyle = '#000000';
        ctx.fillRect(-w * 1.5, -h * 1.5, w * 3, h * 1.5);

        if (s.lidRim.v > 0.05) {
          const rimW = w + 10 * s.lidRim.v;
          const rimH = 6.5 * s.lidRim.v;
          ctx.fillStyle = '#f1f5f9';
          ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.roundRect(-rimW / 2, -rimH / 2, rimW, rimH, rimH / 2);
          ctx.fill();
        }
        ctx.restore();
      }

      ctx.restore();
    }

    // Menggambar 8 Aksesoris Geometris dengan Pendaran Putih Konsisten
    function drawAccessory(acc, baseEyeY, idleFloat) {
      if (acc === 'none') return;

      ctx.save();
      const centerX = W / 2 + lookSmooth.x * 0.45;
      const centerY = baseEyeY + idleFloat + lookSmooth.y * 0.35 + accSpringY;

      // Helper menggambar path dengan 2 lapis glow agar 100% menyatu dengan gaya mata
      const renderGlowingPath = (drawFn, filled = false) => {
        ctx.save();
        ctx.strokeStyle = '#eef2f6';
        ctx.fillStyle = '#eef2f6';
        ctx.shadowColor = 'rgba(255, 255, 255, 0.45)';
        ctx.shadowBlur = 20;
        drawFn();
        filled ? ctx.fill() : ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.strokeStyle = '#f1f5f9';
        ctx.fillStyle = '#f1f5f9';
        ctx.shadowColor = 'rgba(255, 255, 255, 0.75)';
        ctx.shadowBlur = 7;
        drawFn();
        filled ? ctx.fill() : ctx.stroke();
        ctx.restore();
      };

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (acc === 'antenna') {
        // Antena Robot: batang vertikal + bola bercahaya yang bergoyang pelan
        const sway = Math.sin(t * 3.5) * 0.14 + lookSmooth.x * 0.006;
        ctx.translate(centerX, centerY - 62);
        ctx.rotate(sway);

        ctx.lineWidth = 4.5;
        renderGlowingPath(() => {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(0, -34);
        }, false);

        renderGlowingPath(() => {
          ctx.beginPath();
          ctx.arc(0, -39, 7, 0, Math.PI * 2);
        }, true);
      } else if (acc === 'cat_ears') {
        // Telinga Kucing: dua segitiga berongga dengan sudut membulat
        ctx.lineWidth = 4.5;
        [-1, 1].forEach((side) => {
          ctx.save();
          const earWiggle = Math.sin(t * 4 + side) * 0.04;
          ctx.translate(centerX + side * 74, centerY - 56);
          ctx.rotate(side * 0.22 + earWiggle);

          renderGlowingPath(() => {
            ctx.beginPath();
            ctx.moveTo(-18, 12);
            ctx.lineTo(0, -24);
            ctx.lineTo(18, 12);
            ctx.closePath();
          }, false);
          ctx.restore();
        });
      } else if (acc === 'crown') {
        // Mahkota Mini: poligon 7 titik mengambang di tengah atas
        const floatY = Math.sin(t * 3) * 2.5;
        ctx.translate(centerX, centerY - 76 + floatY);

        renderGlowingPath(() => {
          ctx.beginPath();
          ctx.moveTo(-22, 10);
          ctx.lineTo(-26, -12);
          ctx.lineTo(-10, -1);
          ctx.lineTo(0, -18);
          ctx.lineTo(10, -1);
          ctx.lineTo(26, -12);
          ctx.lineTo(22, 10);
          ctx.closePath();
        }, true);
      } else if (acc === 'round_glasses') {
        // Kacamata Bulat: dua bingkai lingkaran + jembatan tengah
        const gx = W / 2 + lookSmooth.x * 0.72;
        const gy = baseEyeY + idleFloat + lookSmooth.y * 0.65 + accSpringY * 0.8;
        ctx.translate(gx, gy);
        ctx.lineWidth = 4;

        renderGlowingPath(() => {
          ctx.beginPath();
          ctx.arc(-68, 0, 44, 0, Math.PI * 2);
          ctx.moveTo(112, 0);
          ctx.arc(68, 0, 44, 0, Math.PI * 2);
          ctx.moveTo(-24, -4);
          ctx.quadraticCurveTo(0, -10, 24, -4);
        }, false);
      } else if (acc === 'square_glasses') {
        // Kacamata Kotak: dua bingkai persegi panjang membulat + jembatan tengah
        const gx = W / 2 + lookSmooth.x * 0.72;
        const gy = baseEyeY + idleFloat + lookSmooth.y * 0.65 + accSpringY * 0.8;
        ctx.translate(gx, gy);
        ctx.lineWidth = 4;

        renderGlowingPath(() => {
          ctx.beginPath();
          ctx.roundRect(-112, -40, 86, 80, 18);
          ctx.roundRect(26, -40, 86, 80, 18);
          ctx.moveTo(-26, -6);
          ctx.lineTo(26, -6);
        }, false);
      } else if (acc === 'halo') {
        // Halo Cincin: elips tipis mengambang lembut
        const floatY = Math.sin(t * 3.2) * 3;
        ctx.translate(centerX, centerY - 78 + floatY);
        ctx.lineWidth = 4;

        renderGlowingPath(() => {
          ctx.beginPath();
          ctx.ellipse(0, 0, 56, 11, 0, 0, Math.PI * 2);
        }, false);
      } else if (acc === 'headphones') {
        // Headphone: busur bando atas + dua kapsul earcup kiri & kanan
        ctx.translate(centerX, centerY - 6);
        ctx.lineWidth = 5.5;

        renderGlowingPath(() => {
          ctx.beginPath();
          ctx.arc(0, 10, 116, Math.PI * 1.07, Math.PI * 1.93);
        }, false);

        renderGlowingPath(() => {
          ctx.beginPath();
          ctx.roundRect(-128, -16, 16, 52, 8);
          ctx.roundRect(112, -16, 16, 52, 8);
        }, true);
      }

      ctx.restore();
    }

    function drawSleepZzz() {
      if (currentState !== 'sleep') return;
      ctx.save();
      ctx.fillStyle = '#f1f5f9';
      ctx.shadowColor = 'rgba(255, 255, 255, 0.55)';
      ctx.shadowBlur = 8;
      ctx.font = 'bold 16px system-ui, sans-serif';

      for (let i = 0; i < 2; i++) {
        const cycle = (t * 0.42 + i * 0.5) % 1;
        const zx = 355 + i * 16 + Math.sin(t * 2 + i) * 4;
        const zy = 80 - cycle * 34;
        ctx.globalAlpha = 0.85 * Math.sin(cycle * Math.PI);
        ctx.fillText(i === 0 ? 'z' : 'Z', zx, zy);
      }
      ctx.restore();
    }

    // ================= 8. LOOP ANIMASI UTAMA (SUB-STEPPED 60/120/144Hz) =================
    function animate(now) {
      const dtSec = Math.min(0.05, Math.max(0.001, (now - lastFrameTime) / 1000));
      lastFrameTime = now;

      t += dtSec * 1.8;
      ctx.clearRect(0, 0, W, H);

      const baseTarget = presets[currentState];
      const targetL = isDrowsyPhase
        ? { ...baseTarget.L, h: 70, dy: 6, lidCut: 28, lidAngle: -0.1, lidRim: 1 }
        : baseTarget.L;
      const targetR = isDrowsyPhase
        ? { ...baseTarget.R, h: 70, dy: 6, lidCut: 28, lidAngle: 0.1, lidRim: 1 }
        : baseTarget.R;

      stepSpringSmooth(springL, targetL, dtSec, 155, 16.5);
      stepSpringSmooth(springR, targetR, dtSec, 155, 16.5);

      // Fisika pantulan mata
      const bounceAccel = -180 * bounceOffset - 16 * bounceVel;
      bounceVel += bounceAccel * dtSec;
      bounceOffset += bounceVel * dtSec;

      // Fisika pegas follow-through untuk aksesoris (sedikit lebih kenyal dari mata)
      const accAccel = -135 * accSpringY - 12 * accSpringVel;
      accSpringVel += accAccel * dtSec;
      accSpringY += accSpringVel * dtSec;

      let idleFloat = 0;
      if (currentState === 'happy') idleFloat = Math.sin(t * 4) * 3;
      else if (currentState === 'sleep' || isDrowsyPhase) idleFloat = Math.sin(t * 1.6) * 3;
      else if (currentState === 'annoyed') idleFloat = Math.sin(t * 22) * 1.2;

      const goalX = lookTarget.x + microSaccade.x;
      const goalY = lookTarget.y + microSaccade.y;

      const prevLookX = lookCurR.x;
      lookSmooth.x = damp(lookSmooth.x, goalX, 18, dtSec);
      lookSmooth.y = damp(lookSmooth.y, goalY, 18, dtSec);

      lookCurR.x = damp(lookCurR.x, lookSmooth.x, 22, dtSec);
      lookCurR.y = damp(lookCurR.y, lookSmooth.y, 22, dtSec);
      lookCurL.x = damp(lookCurL.x, lookSmooth.x, 17, dtSec);
      lookCurL.y = damp(lookCurL.y, lookSmooth.y, 17, dtSec);
      lookVelX = (lookCurR.x - prevLookX) / dtSec;

      blinkScaleR = damp(blinkScaleR, isBlinkingR ? 0.04 : 1, 34, dtSec);
      blinkScaleL = damp(blinkScaleL, isBlinkingL ? 0.04 : 1, 34, dtSec);

      const baseEyeY = 134;
      drawEye(152, baseEyeY + idleFloat, springL, true);
      drawEye(288, baseEyeY + idleFloat, springR, false);
      drawAccessory(currentAccessory, baseEyeY, idleFloat);
      drawSleepZzz();

      requestAnimationFrame(animate);
    }

    // ================= 9. KONTROL EKSPRESI, AKSESORIS & API PUBLIK =================
    function setExpression(state, updateUI = true, isAuto = false) {
      if (!presets[state]) return;
      if (!isAuto) {
        lastInteractionTime = Date.now();
        isDrowsyPhase = false;
      }

      currentState = state;
      bounceVel = -115;
      accSpringVel = -140;
      playDualChirp(state);

      if (['sleep', 'dizzy'].includes(state)) {
        lookTarget = { x: 0, y: 0 };
      }

      if (updateUI) {
        moodText.textContent = `Mood: ${presets[state].label}`;
        moodDot.style.background = isAuto ? '#a855f7' : '#38bdf8';
        moodDot.style.boxShadow = isAuto ? '0 0 8px #a855f7' : '0 0 8px #38bdf8';
        exprButtons.forEach((b) => {
          b.classList.toggle('active', b.dataset.state === state);
        });
      }
    }

    function setAccessory(acc, updateUI = true) {
      currentAccessory = acc;
      accSpringVel = -180; // Efek memantul kecil saat aksesoris dipasang
      playDualChirp('default');

      if (updateUI) {
        accButtons.forEach((b) => {
          b.classList.toggle('active', b.dataset.acc === acc);
        });
      }
    }

    exprButtons.forEach((btn) => {
      btn.addEventListener('pointerdown', () => {
        setExpression(btn.dataset.state, true, false);
      });
    });

    accButtons.forEach((btn) => {
      btn.addEventListener('pointerdown', () => {
        setAccessory(btn.dataset.acc, true);
      });
    });

    autoLifeBtn.addEventListener('click', () => {
      autoLife = !autoLife;
      isDrowsyPhase = false;
      autoLifeBtn.textContent = `Auto-Life: ${autoLife ? 'ON' : 'OFF'}`;
      autoLifeBtn.classList.toggle('on', autoLife);
    });

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = `Suara Robot: ${soundEnabled ? 'ON' : 'OFF'}`;
      soundBtn.classList.toggle('on', soundEnabled);
      if (soundEnabled) playDualChirp('happy');
    });

    // API eksternal untuk mengontrol ekspresi & aksesoris dari script lain
    window.setRobotExpression = (state) => setExpression(state, true, false);
    window.setRobotAccessory = (acc) => setAccessory(acc, true);

    requestAnimationFrame(animate);
  </script>
</body>
